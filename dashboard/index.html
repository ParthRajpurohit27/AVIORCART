<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — AVIORCART</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="icon" href="../assets/favicon-32.png">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ═══ LOGIN SCREEN ═══ -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="login-card__logo">
      <svg width="34" height="34" viewBox="0 0 24 24"><polygon points="12,2 14,9 21,9 15.5,13.5 17.5,21 12,17 6.5,21 8.5,13.5 3,9 10,9" fill="#fbbf24"/></svg>
    </div>
    <h1><span style="color:#fbbf24">AVI</span>OR<span style="color:#fbbf24">CART</span></h1>
    <p>Admin &amp; Owner Dashboard</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@aviorcart.com" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-submit">Sign In</button>
    </form>
  </div>
</div>

<!-- ═══ DASHBOARD SCREEN ═══ -->
<div id="dashboard-screen" style="display:none;flex-direction:column;min-height:100vh;">

  <header class="dash-header">
    <div class="dash-header__inner">
      <a href="index.html" class="dash-logo">
        <svg width="20" height="20" viewBox="0 0 24 24"><polygon points="12,2 14,9 21,9 15.5,13.5 17.5,21 12,17 6.5,21 8.5,13.5 3,9 10,9" fill="#fbbf24"/></svg>
        <span class="dash-logo-text"><span class="g">AVI</span>OR<span class="g">CART</span></span>
        <span class="dash-badge">ADMIN</span>
      </a>
      <div class="dash-header__right">
        <span id="welcome-user"></span>
        <button class="btn-logout" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <main class="dash-main">

    <div class="stats-grid">
      <div class="stat-card gold">
        <div class="stat-card__label">Total Orders</div>
        <div class="stat-card__value" id="stat-total">0</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-card__label">Total Revenue</div>
        <div class="stat-card__value" id="stat-revenue">₹0</div>
      </div>
      <div class="stat-card success">
        <div class="stat-card__label">Successful</div>
        <div class="stat-card__value" id="stat-success">0</div>
      </div>
      <div class="stat-card failed">
        <div class="stat-card__label">Failed</div>
        <div class="stat-card__value" id="stat-failed">0</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-card__label">Pending</div>
        <div class="stat-card__value" id="stat-pending">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All Orders <span id="tab-count-all">0</span></button>
        <button class="filter-tab" data-filter="success">Successful <span id="tab-count-success">0</span></button>
        <button class="filter-tab" data-filter="failed">Failed <span id="tab-count-failed">0</span></button>
        <button class="filter-tab" data-filter="pending">Pending <span id="tab-count-pending">0</span></button>
      </div>

      <div class="toolbar-right">
        <span id="last-updated"></span>
        <button class="icon-btn" id="refresh-btn" title="Refresh orders">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
        <div class="download-group">
          <button class="icon-btn" data-download="pdf" title="Download as PDF">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            PDF
          </button>
          <button class="icon-btn" data-download="png" title="Download as Image">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Image
          </button>
        </div>
      </div>
    </div>

    <div class="orders-grid" id="orders-list">
      <div class="empty-state">Loading orders…</div>
    </div>

  </main>

  <footer class="dash-footer">
    <div>© <span id="footer-year"></span> AVIORCART. All rights reserved. — Founder <strong>Parth Rajpurohit</strong></div>
    <div style="margin-top:4px;">Payment Partners: Delhivery &bull; PayU</div>
  </footer>

</div>

<div class="toast" id="toast"></div>

<!-- CDN libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Compiled TypeScript (order matters — plain global scripts, no bundler) -->
<script src="assets/dist/config.js"></script>
<script src="assets/dist/supabaseClient.js"></script>
<script src="assets/dist/auth.js"></script>
<script src="assets/dist/orders.js"></script>
<script src="assets/dist/exportUtil.js"></script>
<script src="assets/dist/main.js"></script>
<script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
</body>
</html>
